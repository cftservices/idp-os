<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Zonder deze regels valt "sans-serif" (en daarmee system-ui) in een kale
  Debian-container terug op Liberation Mono: de hele UI in een typemachine-
  letter. Gemeten met fc-match op 20-11-2026. Inter ligt het dichtst bij de
  Segoe UI waarvoor de UI is ontworpen.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
