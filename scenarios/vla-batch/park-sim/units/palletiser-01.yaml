  - slot: 1
    group: A
    name: StateCurrent
    display_name: PackML-toestand
    native_name: VLA.PAL01.STATE_CURRENT
    canonical_unit: ""
    native_unit: ""
    datatype: Int32
    writable: false
    sampling_class: onchange
    source: state_machine.current.value
    eu_min: 1
    eu_max: 17
    native_datatype: Int32
    quality_datatype: String
    distort:
      scaling_kind: none
      discrete: true
      quality_source: text-enum
      quality_encoding:
        Good: GOOD
        Suspect: UNCERTAIN
        Bad: BAD
