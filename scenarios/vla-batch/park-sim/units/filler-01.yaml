# GEGENEREERD DOOR tools/gen-park.py — NIET MET DE HAND BEWERKEN
# bron: factory-model/isa95-vla.json + signal-template.json + vendor-profiles.json
#
# Unit-config voor filler-01. De container mount dit read-only en leest verder
# NIETS uit het enterprise-model: een PLC doet dat ook niet.
#
# Het distort-blok per signaal is LETTERLIJK dezelfde regel als in
# factory-model/park-conditioning.json. De sim past hem VOORWAARTS toe
# (canoniek -> native), de conditioner draait hem TERUG. Uit een bron
# gegenereerd, dus de twee kanten kunnen niet uiteenlopen; dat de wiskunde
# ook echt omkeerbaar is bewijst de round-trip-selftest.

unit_id: filler-01
equipment: filler-01
name: Filler 01
type: fill-line
area: Filling
line: Vla-B
site: DairyWorks

packml:
  mach_design_speed: 120.0
  initial_mach_speed: 120.0
  auto_start: true

surface: mqtt
protocol: mqtt
vendor_profile: vendor-d
machine_ordinal: 1
raw_root: raw/vla-park/filler-01
extended_pvs: true

sim:
  step_s: 0.2
  sampling_classes:
    fast: 1000
    normal: 5000
    slow: 30000
    onchange: null
  keepalive_s: 60

# Deze machine LOOPT MEE met de batch op de monoliet. Hij is geen
# tweede fabriek: de monoliet-waarden zijn stuurwaarden, en de eigen
# fysica bepaalt met welke traagheid, ruis en storing hij ze haalt.
follow:
  mode: follow
  batch_state_topic: DairyWorks/Vla/Batch/Status/state
  batch_id_topic: DairyWorks/Vla/Batch/Status/batch_id
  active_phases:
    - FILLING
  drivers:
    - topic: DairyWorks/Vla/Cooling/cooler-01/Status/temp_C
      target: physics.inlet_temp_c
      unit: °C
  fallback:
    mode: free
    after_silence_s: 90
    announce_topic: DairyWorks/Vla-B/DataQuality/follow-01/Status/filler-01_mode

physics:
  cip_cycle_limit: 4
  design_speed: 120.0
  nominal_current_a: 16.0
  nominal_ppm: 120.0
  pack_size_l: 1.0
  reject_base_pct: 0.4
  target_seal_C: 185.0

faults:
  - f8
  - f12
  - f13

# 30 slots. Elke regel: canonieke naam, wat de leverancier ervan maakt,
# en hoe hij hem verminkt. De sim past dit VOORWAARTS toe; de conditioner
# draait het terug. Die round-trip is de belangrijkste offline test.
signals:
  - slot: 1
    group: A
    name: StateCurrent
    display_name: PackML-toestand
    native_name: sensors/stateCurrent
    canonical_unit: ""
    native_unit: ""
    datatype: Int32
    writable: false
    sampling_class: onchange
    source: state_machine.current.value
    eu_min: 1
    eu_max: 17
    native_datatype: Int32
    distort:
      scaling_kind: none
      discrete: true
      quality_source: none
      timestamp_source: epoch-ms
