# GEGENEREERD DOOR tools/gen-park.py — NIET MET DE HAND BEWERKEN
# bron: factory-model/isa95-vla.json + signal-template.json + vendor-profiles.json
#
# Unit-config voor intake-silo-01. De container mount dit read-only en leest verder
# NIETS uit het enterprise-model: een PLC doet dat ook niet.
#
# Het distort-blok per signaal is LETTERLIJK dezelfde regel als in
# factory-model/park-conditioning.json. De sim past hem VOORWAARTS toe
# (canoniek -> native), de conditioner draait hem TERUG. Uit een bron
# gegenereerd, dus de twee kanten kunnen niet uiteenlopen; dat de wiskunde
# ook echt omkeerbaar is bewijst de round-trip-selftest.

unit_id: intake-silo-01
equipment: intake-silo-01
name: Intake silo 01
type: storage-tank
area: Receiving
line: Vla-B
site: DairyWorks

packml:
  mach_design_speed: 120.0
  initial_mach_speed: 120.0
  auto_start: true

surface: opcua
protocol: opc-da
vendor_profile: vendor-a
machine_ordinal: 2
raw_root: raw/vla-park/intake-silo-01
extended_pvs: true

opcua:
  endpoint: opc.tcp://vla-intake-silo-01:4840/VendorA
  namespace_uri: urn:vendor-a.intake-silo-01
  namespace_index: 2
  # Weiger te starten als register_namespace() een andere index geeft:
  # de gegenereerde adreslijst hardcodeert hem en zou er stil naast grijpen.
  strict_namespace_index: true

sim:
  step_s: 0.2
  sampling_classes:
    fast: 1000
    normal: 5000
    slow: 30000
    onchange: null
  keepalive_s: 60

# Deze machine LOOPT MEE met de batch op de monoliet. Hij is geen
# tweede fabriek: de monoliet-waarden zijn stuurwaarden, en de eigen
# fysica bepaalt met welke traagheid, ruis en storing hij ze haalt.
follow:
  mode: follow
  batch_state_topic: DairyWorks/Vla/Batch/Status/state
  batch_id_topic: DairyWorks/Vla/Batch/Status/batch_id
  active_phases:
    - DOSING
  drivers:
    - topic: DairyWorks/Vla/Mixing/process-tank-01/Status/level_L
      target: physics.draw_target_L
      unit: L
  fallback:
    mode: free
    after_silence_s: 90
    announce_topic: DairyWorks/Vla-B/DataQuality/follow-01/Status/intake-silo-01_mode

physics:
  capacity_L: 10000.0
  cip_cycle_limit: 8
  design_speed: 120.0
  nominal_current_a: 12.0

faults:
  - f1
  - f2
  - f8

quality_companion:
  suffix: .Q
  sampling_class: slow
  encoding:
    192: GOOD
    64: UNCERTAIN
    0: BAD

# 30 slots. Elke regel: canonieke naam, wat de leverancier ervan maakt,
# en hoe hij hem verminkt. De sim past dit VOORWAARTS toe; de conditioner
