  - slot: 1
    group: A
    name: StateCurrent
    display_name: PackML-toestand
    native_name: 40101
    canonical_unit: ""
    native_unit: ""
    datatype: Int32
    writable: false
    sampling_class: onchange
    source: state_machine.current.value
    eu_min: 1
    eu_max: 17
    native_datatype: Int32
    quality_datatype: Int16
    distort:
      scaling_kind: none
      discrete: true
      modbus_addr: 40101
      modbus_width: 2
      modbus_encoding: int32_hi_lo
      modbus_status_addr: 40152
      quality_source: status-word
      quality_encoding:
        0: GOOD
        1: BAD
        2: UNCERTAIN
