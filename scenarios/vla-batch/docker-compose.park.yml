# GEGENEREERD DOOR tools/gen-park.py — NIET MET DE HAND BEWERKEN
#
# Lijn Vla-B: het machinepark. Overlay op docker-compose.slim.yml, NAAST
# docker-compose.vla.yml. De monoliet blijft ongemoeid draaien.
#
# Alles zit achter compose-profielen:
#   park-slim   een machine per leveranciersprofiel, de staande configuratie
#   park        het volledige park, omhoog voor een live demo
# Zonder --profile start er niets van dit bestand. Dat is de belangrijkste
# regressiebeveiliging: geen vlag, geen verandering.
#
# Geheugen- en CPU-limieten staan op ELKE machine. De VPS is 2 vCPU en
# 8 GB en draait de monoliet al; een doorgeslagen sim mag de broker niet
# kunnen uithongeren. Zie het VPS-hoofdstuk van het plan voor het budget.

services:

  # intake-silo-01 | vendor-a | opc-da
  vla-intake-silo-01:
    build:
      context: ./packml-sim
      dockerfile: Dockerfile
    image: techflow/packml-sim:latest
    container_name: vla-intake-silo-01
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["python", "park_runner.py"]
    environment:
      UNIT_CONFIG: /units/intake-silo-01.yaml
      MQTT_HOST: monstermq
      MQTT_PORT: "1883"
      LOG_LEVEL: ${PARK_LOG_LEVEL:-INFO}
    volumes:
      - ./scenarios/vla-batch/park-sim/units:/units:ro
    mem_limit: 192m
    cpus: 0.15
    networks:
      - idp-network
    depends_on:
      monstermq:
        condition: service_healthy
    profiles: ["park"]

